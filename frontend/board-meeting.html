<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Board Meeting — ProductIQ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/arabic.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .agent-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      margin-bottom: 16px; overflow: hidden; opacity: 0; transform: translateY(12px);
      animation: agentIn 0.5s ease forwards;
    }
    @keyframes agentIn { to { opacity: 1; transform: none; } }
    .agent-head {
      display: flex; align-items: center; gap: 12px; padding: 14px 20px;
      border-bottom: 1px solid var(--border-light);
    }
    .agent-avatar {
      width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 1.125rem; font-weight: 700;
    }
    .agent-role { font-weight: 700; font-size: 0.9375rem; }
    .agent-tag { font-size: 0.75rem; color: var(--text-light); }
    .agent-body { padding: 16px 20px; font-size: 0.9rem; line-height: 1.75; color: var(--text-primary); }
    .agent-card.final { border-width: 2px; border-color: var(--navy); box-shadow: var(--shadow-lg); }
    .agent-card.final .agent-body {
      background: linear-gradient(180deg, rgba(11,31,58,0.04), transparent);
      font-weight: 500;
    }
    .final-ribbon {
      display: inline-block; margin-top: 10px; padding: 5px 14px; border-radius: 20px;
      background: var(--gold); color: white; font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .context-panel {
      background: var(--border-light); border-radius: var(--radius-sm);
      padding: 14px 18px; font-size: 0.8125rem; line-height: 1.7; white-space: pre-wrap;
      color: var(--text-secondary); margin-top: 16px; font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <nav class="topbar">
      <div class="brand">
        <div class="logo-icon">PQ</div>
        <div>
          <span class="brand-name" data-i18n="app.name">ProductIQ</span>
          <span class="brand-sub" data-i18n="app.tagline">AI Retail Decision Engine</span>
        </div>
      </div>
      <div class="nav-links">
        <button class="nav-item" data-page="home" data-href="index.html"><span class="nav-dot"></span><span data-i18n="nav.home">Home</span></button>
        <button class="nav-item" data-page="upload" data-href="upload.html"><span class="nav-dot"></span><span data-i18n="nav.upload">Upload</span></button>
        <button class="nav-item" data-page="dashboard" data-href="dashboard.html"><span class="nav-dot"></span><span data-i18n="nav.dashboard">Dashboard</span></button>
        <button class="nav-item" data-page="dna" data-href="product-dna.html"><span class="nav-dot"></span><span data-i18n="nav.dna">Product DNA</span></button>
        <button class="nav-item" data-page="report" data-href="ceo-report.html"><span class="nav-dot"></span><span data-i18n="nav.report">CEO Report</span></button>
        <button class="nav-item" data-page="simulator" data-href="simulator.html"><span class="nav-dot"></span><span data-i18n="nav.simulator">Simulator</span></button>
        <button class="nav-item" data-page="board" data-href="board-meeting.html"><span class="nav-dot"></span><span data-i18n="nav.board">Board Meeting</span></button>
        <button class="nav-item" data-page="research" data-href="research.html"><span class="nav-dot"></span><span data-i18n="nav.research">Research</span></button>
        <button class="nav-item" data-page="history" data-href="history.html"><span class="nav-dot"></span><span data-i18n="nav.history">History</span></button>
      </div>
      <div class="topbar-right">
        <div class="lang-toggle">
          <button class="lang-btn active" data-lang="en" onclick="I18n.setLang('en')">EN</button>
          <button class="lang-btn" data-lang="ar" onclick="I18n.setLang('ar')">عربي</button>
        </div>
        <div id="userMenu" class="user-menu"></div>
        <button class="hamburger" aria-label="Menu">☰</button>
      </div>
    </nav>

    <div class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="hamburger">☰</button>
          <div>
            <div class="header-title" data-i18n="board.title">AI Board Meeting</div>
            <div class="header-breadcrumb" data-i18n="board.subtitle">Four executives. One decision.</div>
          </div>
        </div>
        <div class="header-right"></div>
      </header>

      <main class="page-content">
        <!-- Setup -->
        <div class="simulator-input">
          <div class="param-row">
            <div class="param-field">
              <label data-i18n="dna.select">Select a product</label>
              <select id="boardProduct"></select>
            </div>
            <div>
              <button class="btn btn-gold btn-lg" id="startBtn"><span data-i18n="board.start">Start Board Meeting</span></button>
            </div>
          </div>
        </div>

        <!-- Meeting output -->
        <div id="meetingOutput" style="display:none; max-width:860px; margin:0 auto">
          <div class="flex-between mb-2">
            <h3>Meeting Transcript</h3>
            <div id="engineBadge"></div>
          </div>
          <div class="card mb-3" id="financialPanel" style="display:none">
            <div class="card-header"><h3>Case Financials</h3></div>
            <div class="card-body">
              <div class="grid-4" id="finGrid"></div>
            </div>
          </div>
          <div id="agentCards"></div>
          <div class="card" style="margin-top:24px">
            <div class="card-header"><h3 data-i18n="board.context">Case file reviewed by the board</h3></div>
            <div class="card-body"><div class="context-panel" id="contextPanel"></div></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    App.initNav('board');
    App.initConnectionBanner();
    let products = [];
    const ar = () => I18n.lang === 'ar';

    async function loadProducts() {
      try {
        products = await Api.getProductList();
        if (!products || !products.length) { products = []; return; }
        document.getElementById('boardProduct').innerHTML = products.map(p =>
          `<option value="${p.id}">${ar() && p.name_ar ? p.name_ar : p.name}</option>`).join('');
      } catch (e) { products = []; }
    }

    let health = { available: false, last_error: '' };
    App.checkHealth().then(h => { health = h; }).catch(() => {});

    document.getElementById('startBtn').addEventListener('click', async () => {
      const pid = document.getElementById('boardProduct').value;
      App.showLoading(true);
      const res = await Api.boardMeeting(pid, I18n.lang);
      App.showLoading(false);
      document.getElementById('engineBadge').innerHTML = App.engineBadge(res.engine, health.last_error);
      renderMeeting(res);
    });

    const AGENT_INITIALS = { 'CFO': 'CF', 'Marketing Director': 'MK', 'Inventory Manager': 'IN', 'CEO': 'CE' };

    function parseFinMetrics(ctx) {
      const m = {};
      const match = (re) => { const r = re.exec(ctx); return r ? r[1] : null; };
      m.margin = match(/Margin:\s*([\d.]+)%/);
      m.price = match(/Price:\s*([\d,]+)\s*EGP/);
      m.cost = match(/Cost:\s*([\d,]+)\s*EGP/);
      m.revenue = match(/([\d,]+)\s*EGP\s*revenue/);
      m.profit = match(/([\d,]+)\s*EGP\s*profit/);
      m.stock = match(/Current stock:\s*(\d+)/);
      return m;
    }

    function renderFinancialPanel(fin) {
      const panel = document.getElementById('financialPanel');
      if (!fin.margin && !fin.revenue) { panel.style.display = 'none'; return; }
      panel.style.display = 'block';
      const cells = [
        { label: 'Margin', value: fin.margin ? fin.margin + '%' : '--' },
        { label: 'Revenue (30d)', value: fin.revenue ? App.egp(parseInt(fin.revenue.replace(/,/g, ''))) : '--' },
        { label: 'Profit (30d)', value: fin.profit ? App.egp(parseInt(fin.profit.replace(/,/g, ''))) : '--' },
        { label: 'Stock', value: fin.stock || '--' },
      ];
      document.getElementById('finGrid').innerHTML = cells.map(c =>
        `<div class="stat-card" style="padding:14px;text-align:center">
          <div class="kpi-label">${c.label}</div>
          <div class="kpi-value" style="font-size:1.2rem">${c.value}</div>
        </div>`
      ).join('');
    }

    function renderMeeting(res) {
      if (!res || !res.transcript) return;
      document.getElementById('meetingOutput').style.display = 'block';

      const fin = parseFinMetrics(res.context || '');
      renderFinancialPanel(fin);

      const wrap = document.getElementById('agentCards');
      wrap.innerHTML = '';

      res.transcript.forEach((agent, i) => {
        const roleName = ar() ? agent.role_ar : agent.role_en;
        const card = document.createElement('div');
        card.className = 'agent-card' + (agent.is_final ? ' final' : '');
        card.style.animationDelay = (i * 0.35) + 's';
        const init = AGENT_INITIALS[agent.role_en] || '--';
        card.innerHTML = `
          <div class="agent-head">
            <div class="agent-avatar" style="background:${agent.color}">${init}</div>
            <div>
              <div class="agent-role">${roleName}</div>
              <div class="agent-tag">ProductIQ Board</div>
            </div>
          </div>
          <div class="agent-body">${agent.analysis.replace(/\n/g, '<br>')}
            ${agent.is_final ? `<div><span class="final-ribbon">${ar() ? 'القرار النهائي' : 'Final Decision'}</span></div>` : ''}
          </div>`;
        wrap.appendChild(card);
      });

      document.getElementById('contextPanel').textContent = res.context || '';
      document.getElementById('meetingOutput').scrollIntoView({ behavior: 'smooth' });
    }

    document.addEventListener('langchange', loadProducts);
    loadProducts();
  </script>
</body>
</html>
