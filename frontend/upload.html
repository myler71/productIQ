<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Data — ProductIQ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/arabic.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-icon">PQ</div>
        <div>
          <div class="brand-name" data-i18n="app.name">ProductIQ</div>
          <div class="brand-sub" data-i18n="app.tagline">AI Retail Decision Engine</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title" data-i18n="nav.section.main">Main</div>
          <button class="nav-item" data-page="home" data-href="index.html"><span class="nav-icon">🏠</span><span data-i18n="nav.home">Home</span></button>
          <button class="nav-item" data-page="upload" data-href="upload.html"><span class="nav-icon">📤</span><span data-i18n="nav.upload">Upload Data</span></button>
          <button class="nav-item" data-page="dashboard" data-href="dashboard.html"><span class="nav-icon">📊</span><span data-i18n="nav.dashboard">Dashboard</span></button>
        </div>
        <div class="nav-section">
          <div class="nav-section-title" data-i18n="nav.section.ai">AI Intelligence</div>
          <button class="nav-item" data-page="dna" data-href="product-dna.html"><span class="nav-icon">🧬</span><span data-i18n="nav.dna">Product DNA</span></button>
          <button class="nav-item" data-page="report" data-href="ceo-report.html"><span class="nav-icon">📋</span><span data-i18n="nav.report">CEO Report</span></button>
          <button class="nav-item" data-page="simulator" data-href="simulator.html"><span class="nav-icon">🔮</span><span data-i18n="nav.simulator">Simulator</span></button>
          <button class="nav-item" data-page="board" data-href="board-meeting.html"><span class="nav-icon">🏛️</span><span data-i18n="nav.board">Board Meeting</span></button>
        </div>
      </nav>
    </aside>
    <div class="sidebar-overlay"></div>

    <div class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="hamburger">☰</button>
          <div>
            <div class="header-title" data-i18n="upload.title">Upload Store Data</div>
            <div class="header-breadcrumb" data-i18n="upload.subtitle">Upload your CSV exports or load the sample dataset.</div>
          </div>
        </div>
        <div class="header-right">
          <div class="lang-toggle">
            <button class="lang-btn active" data-lang="en" onclick="I18n.setLang('en')">EN</button>
            <button class="lang-btn" data-lang="ar" onclick="I18n.setLang('ar')">عربي</button>
          </div>
        </div>
      </header>

      <main class="page-content">
        <div class="grid-2" style="align-items:start">
          <div class="card">
            <div class="card-header"><h3 data-i18n="upload.title">Upload Store Data</h3></div>
            <div class="card-body">
              <div class="upload-zone" id="dropZone">
                <div class="upload-icon">📁</div>
                <h3 data-i18n="upload.drag">Drag & drop your CSV files here</h3>
                <p data-i18n="upload.or">or click to browse</p>
                <div class="file-types">
                  <span class="file-type">products.csv</span>
                  <span class="file-type">sales.csv</span>
                  <span class="file-type">inventory.csv</span>
                  <span class="file-type">suppliers.csv</span>
                </div>
                <input type="file" id="fileInput" multiple accept=".csv" style="display:none">
              </div>
              <div class="upload-progress" id="progressBox" style="display:none">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <div style="font-size:0.8125rem;color:var(--text-secondary)" id="progressLabel">Uploading…</div>
              </div>
              <div class="flex gap-2 mt-3 wrap">
                <button class="btn btn-outline" id="sampleBtn">📦 <span data-i18n="btn.loadSample">Load Sample Data</span></button>
              </div>
            </div>
          </div>

          <div class="card" id="resultsCard" style="display:none">
            <div class="card-header"><h3 data-i18n="upload.validation.title">Validation Results</h3></div>
            <div class="card-body" id="resultsBody"></div>
            <div class="card-footer">
              <a href="dashboard.html" class="btn btn-primary btn-sm" data-i18n="btn.analyze">Analyze</a>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    const dz = document.getElementById('dropZone');
    const fi = document.getElementById('fileInput');
    App.initSidebar('upload');

    dz.addEventListener('click', () => fi.click());
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', e => {
      e.preventDefault(); dz.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });
    fi.addEventListener('change', () => handleFiles(fi.files));
    document.getElementById('sampleBtn').addEventListener('click', async () => {
      App.showLoading(true);
      const res = await Api.loadSample();
      App.showLoading(false);
      renderResults(res);
    });

    async function handleFiles(files) {
      if (!files.length) return;
      const box = document.getElementById('progressBox');
      const fill = document.getElementById('progressFill');
      box.style.display = 'block';
      fill.style.width = '30%';
      const res = await Api.uploadFiles(Array.from(files));
      fill.style.width = '100%';
      setTimeout(() => { box.style.display = 'none'; fill.style.width = '0%'; }, 500);
      renderResults(res);
    }

    function renderResults(res) {
      if (!res) return;
      const card = document.getElementById('resultsCard');
      const body = document.getElementById('resultsBody');
      card.style.display = 'block';
      let html = '<table><thead><tr><th>File</th><th>Rows</th><th>Valid</th><th>Flagged</th><th>Rejected</th></tr></thead><tbody>';
      res.files.forEach(f => {
        html += `<tr><td><strong>${f.name}</strong></td><td>${f.rows}</td>
          <td><span class="badge badge-success">${f.valid}</span></td>
          <td>${f.flagged ? `<span class="badge badge-warning">${f.flagged}</span>` : '0'}</td>
          <td>${f.rejected ? `<span class="badge badge-danger">${f.rejected}</span>` : '0'}</td></tr>`;
      });
      html += '</tbody></table>';
      if (res.flags && res.flags.length) {
        html += `<h4 class="mt-3 mb-2" style="font-size:0.875rem">⚠️ Review queue</h4>`;
        res.flags.forEach(fl => {
          const reason = I18n.lang === 'ar' ? fl.reason_ar : fl.reason_en;
          html += `<div style="padding:10px 14px;background:var(--warning-bg);border-radius:8px;margin-bottom:8px;font-size:0.8125rem">
            <strong>${fl.file}</strong> · row ${fl.row} — ${reason}</div>`;
        });
      }
      body.innerHTML = html;
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  </script>
</body>
</html>
